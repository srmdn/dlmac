<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dlmac transcript</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">dl</span>
          <div>
            <p class="eyebrow">127.0.0.1 transcript bench</p>
            <h1>dlmac</h1>
          </div>
        </div>
        <div class="status-strip">
          <span>{{ .Version }}</span>
          <span>captions only</span>
          <span>no accounts</span>
        </div>
      </header>

      <section class="workspace" aria-label="Transcript workspace">
        <form class="panel form-panel" id="transcript-form">
          <label class="field">
            <span><b>01</b> Source URL</span>
            <input id="url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required>
          </label>

          <fieldset>
            <legend><b>02</b> Caption Language</legend>
            <div class="segments">
              <label><input type="radio" name="lang" value="en" checked><span>English</span></label>
              <label><input type="radio" name="lang" value="id"><span>Indonesian</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend><b>03</b> Export Format</legend>
            <div class="segments">
              <label><input type="radio" name="format" value="txt" checked><span>Text</span></label>
              <label><input type="radio" name="format" value="vtt"><span>WebVTT</span></label>
              <label><input type="radio" name="format" value="srt"><span>SRT</span></label>
            </div>
          </fieldset>

          <button class="primary" type="submit" id="submit-button">
            <span class="button-label">Get Transcript</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <section class="panel output-panel" aria-live="polite">
          <div class="output-header">
            <div>
              <p class="eyebrow">reader pane</p>
              <h2 id="output-title">Ready</h2>
            </div>
            <div class="actions">
              <button type="button" id="copy-button" disabled>Copy</button>
              <a id="download-link" class="download disabled" href="#" aria-disabled="true">Download</a>
            </div>
          </div>

          <div class="message" id="message">Paste a public video URL, choose the transcript options, and run it locally.</div>
          <div class="paper">
            <pre id="transcript" tabindex="0"></pre>
          </div>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
